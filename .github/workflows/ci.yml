name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.8
        env:
          POSTGRES_USER: presenze
          POSTGRES_PASSWORD: presenze
          POSTGRES_DB: presenze
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U presenze" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://presenze:presenze@localhost:5432/presenze
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
