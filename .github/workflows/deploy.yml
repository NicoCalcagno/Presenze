# Rilascio su Railway (servizio `presenze`). Solvo lo riconosce come rilascio
# (`deploy_workflow` del prodotto) e per il rollback lo avvia con `workflow_dispatch` e la
# versione precedente (uno sha di 12 caratteri) nell'input `version`.
# Serve il secret RAILWAY_TOKEN: un token del progetto Railway (Project → Settings → Tokens).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Commit da rilasciare (vuoto: la testa di main)"
        required: false

# Niente `concurrency`: un run in attesa verrebbe annullato da quello dopo (anche un
# rollback).

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # La versione può essere uno sha corto: checkout non lo accetta come `ref`, git sì.
      - name: Versione da rilasciare
        if: inputs.version
        env:
          VERSION: ${{ inputs.version }}
        run: git checkout --detach "$VERSION"
      - name: Rilascio
        run: |
          VERSION=$(git rev-parse --short=12 HEAD)
          echo "Rilascio di $VERSION"
          npm install -g @railway/cli@4.68.0
          railway variable set "PRESENZE_VERSION=$VERSION" --service presenze --skip-deploys
          railway up --service presenze --ci
