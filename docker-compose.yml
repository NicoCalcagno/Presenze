# Presenze sul Mac, accanto a Solvo (che va avviato prima: i log vanno al suo collector).
#   PRESENZE_VERSION=$(git rev-parse --short=12 HEAD) docker compose up -d --build
# API: http://localhost:8090 · Postgres: localhost:5434 (presenze/presenze, solvo_ro/solvo_ro)
name: presenze

services:
  db:
    image: postgres:16.8
    environment:
      POSTGRES_USER: presenze
      POSTGRES_PASSWORD: presenze
      POSTGRES_DB: presenze
    ports: ["5434:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U presenze -d presenze"]
      interval: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        PRESENZE_VERSION: ${PRESENZE_VERSION:-dev}
    environment:
      DATABASE_URL: postgresql://presenze:presenze@db:5432/presenze
      PRESENZE_ENV: prod
      # Il collector OTel di Solvo (docker-compose di Solvo, porta 4318 sul Mac).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["8090:8080"]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped

  # Dipendenti finti (`docker compose --profile traffico up -d`).
  traffico:
    profiles: [traffico]
    image: python:3.12-slim
    command: ["python", "/traffic/simula.py", "--url", "http://app:8080", "--rate", "${TRAFFIC_RATE:-2}"]
    volumes: [./traffic:/traffic:ro]
    depends_on: [app]
    restart: unless-stopped

volumes:
  dbdata:
